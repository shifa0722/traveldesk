<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelDesk - Booking History</title>
    <script src="https://kit.fontawesome.com/1be34d6bad.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg portal-nav">
    <div class="container">
        <a class="navbar-brand travel-brand" href="dashboard.html">
            <span class="travel-logo">✈</span>
            <span>Travel<span class="brand-highlight">Desk</span></span>
        </a>
        <a href="dashboard.html" class="btn btn-outline-primary btn-sm nav-dashboard-link">
            <i class="fa-solid fa-arrow-left"></i> Dashboard
        </a>
    </div>
</nav>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 history-heading">
        <div>
            <h2 class="fw-bold mb-1">Booking History</h2>
            <p class="text-muted mb-0">Review your confirmed travel bookings.</p>
        </div>
        <button id="clearHistoryBtn" class="btn btn-outline-danger btn-sm">
            <i class="fa-solid fa-trash-can me-1"></i> Clear History
        </button>
    </div>

    <div id="historyEmpty" class="card border-0 shadow-sm text-center p-5 d-none">
        <div class="service-icon mb-3"><i class="fa-solid fa-ticket"></i></div>
        <h5 class="fw-bold">No bookings yet</h5>
        <p class="text-muted mb-3">Your confirmed train, flight, and bus bookings will appear here.</p>
        <a href="dashboard.html" class="btn btn-primary">Browse Services</a>
    </div>

    <div id="historyList" class="history-list"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
