<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelDesk - Bus Booking</title>
    <script src="https://kit.fontawesome.com/1be34d6bad.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg portal-nav">
    <div class="container">
        <a class="navbar-brand travel-brand" href="dashboard.html">
            <span class="travel-logo">✈</span>
            <span>Travel<span class="brand-highlight">Desk</span></span>
        </a>
        <a href="dashboard.html" class="btn btn-outline-primary btn-sm nav-dashboard-link">
            <i class="fa-solid fa-arrow-left"></i> Dashboard
        </a>
    </div>
</nav>

<main class="container py-4">
    <div class="mb-4">
        <h2 class="fw-bold">Bus Booking</h2>
        <p class="text-muted">Search and book buses for your passengers.</p>
    </div>

    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body p-4">
            <h5 class="fw-bold mb-4">Search Bus</h5>
            <form id="busSearchForm">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">From</label>
                        <select id="fromStation" class="form-select">
                            <option value="">Select City</option>
                            <option value="Mumbai">Mumbai</option>
                            <option value="Pune">Pune</option>
                            <option value="Bengaluru">Bengaluru</option>
                            <option value="Hyderabad">Hyderabad</option>
                            <option value="Goa">Goa</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">To</label>
                        <select id="toStation" class="form-select">
                            <option value="">Select City</option>
                            <option value="Mumbai">Mumbai</option>
                            <option value="Pune">Pune</option>
                            <option value="Bengaluru">Bengaluru</option>
                            <option value="Hyderabad">Hyderabad</option>
                            <option value="Goa">Goa</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Journey Date</label>
                        <input type="date" id="journeyDate" class="form-control">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Seat Type</label>
                        <select id="quota" class="form-select">
                            <option value="Seater">Seater</option>
                            <option value="Sleeper">Sleeper</option>
                            <option value="AC Sleeper">AC Sleeper</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary">
                            <i class="fa-solid fa-magnifying-glass me-1"></i> Search Buses
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <section id="busResultsSection" class="d-none">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold">Available Buses</h4>
            <input type="text" id="busFilter" class="form-control" placeholder="Search bus..." style="max-width:250px;">
        </div>
        <div id="busResults"></div>
    </section>

    <section id="passengerSection" class="d-none mt-5">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <div class="mb-4">
                    <h4 class="fw-bold mb-1">Passenger Details</h4>
                    <p class="text-muted small mb-0">Enter passenger information carefully before booking.</p>
                </div>
                <div id="selectedTrainInfo" class="alert alert-primary"></div>
                <div class="mb-3 passenger-count-field">
                    <label for="passengerCount" class="form-label">Number of Passengers</label>
                    <select id="passengerCount" class="form-select">
                        <option value="1">1 Passenger</option>
                        <option value="2">2 Passengers</option>
                        <option value="3">3 Passengers</option>
                        <option value="4">4 Passengers</option>
                        <option value="5">5 Passengers</option>
                    </select>
                </div>
                <form id="passengerForm">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Passenger Name</label>
                            <input type="text" id="passengerName" class="form-control" placeholder="Enter passenger name">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Contact Number</label>
                            <input type="tel" id="contactNumber" class="form-control" placeholder="10 digit mobile number" maxlength="10">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email ID</label>
                            <input type="email" id="email" class="form-control" placeholder="Enter email address">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Gender</label>
                            <select id="gender" class="form-select">
                                <option value="">Select Gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Meal Preference</label>
                            <select id="food" class="form-select">
                                <option value="No Preference">No Preference</option>
                                <option value="Vegetarian">Vegetarian</option>
                                <option value="Non-Vegetarian">Non-Vegetarian</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Address</label>
                            <input type="text" id="address" class="form-control" placeholder="Enter address">
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-success px-4">Book Now</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </section>
</main>

<div class="modal fade" id="otpModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">OTP Verification</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center">
                <p class="text-muted">Enter the OTP sent to the passenger's email.</p>
                <p class="small text-primary">Demo OTP: 123456</p>
                <input type="text" id="otpInput" class="form-control text-center" maxlength="6" placeholder="Enter 6 digit OTP">
                <div id="otpMessage" class="mt-3"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-success" id="verifyOtp">Verify OTP</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
